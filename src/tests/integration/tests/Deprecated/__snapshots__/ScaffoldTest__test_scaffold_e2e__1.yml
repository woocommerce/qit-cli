    import { test, expect } from '@playwright/test';
    import qit from '/qitHelpers';

    test('I can see my plugin menu', async ({ page }) => {
        // Log-in as admin.
        await qit.loginAsAdmin(page);
        // View WordPress Core "Dashboard" heading
