name: QIT CLI Code tests
on:
  workflow_call:
  push:
    paths:
      - 'src/**.php'

concurrency:
  group: code-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code_tests:
    name: Code tests
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Reuse Docker restore & build
        uses: ./.github/workflows/restore-docker-cache.yml
        with:
          php-version: 8.3  # Using default PHP version 8.3

      - uses: actions/cache@v3
        id: cache-composer
        with:
          path: src/vendor
          key: ${{ runner.os }}-${{ hashFiles('src/composer.lock') }}

      - name: Composer install
        if: steps.cache-composer.outputs.cache-hit != 'true'
        working-directory: src
        run: composer install

      - name: Run PHPCS
        run: make phpcs

      - name: Run PHPStan
        run: make phpstan

      - name: Run Phan
        run: make phan
