name: QIT CLI Code tests
on:
  workflow_call:
  push:
    paths:
      - 'src/**.php'

jobs:
  code_tests:
    name: Code tests
    runs-on: ubuntu-20.04
    env:
      DEFAULT_PHP_VERSION: 8.3
    steps:
      - name: Restore Docker image using reusable workflow
        uses: ./.github/workflows/restore-docker-cache.yml
        with:
          php-version: ${{ env.DEFAULT_PHP_VERSION }}

      - uses: actions/cache@v3
        id: cache-composer
        with:
          path: src/vendor
          key: ${{ runner.os }}-${{ hashFiles('src/composer.lock') }}

      - name: Composer install
        if: steps.cache-composer.outputs.cache-hit != 'true'
        working-directory: src
        run: composer install

      - name: Run PHPCS
        run: make phpcs

      - name: Run PHPStan
        run: make phpstan

      - name: Run Phan
        run: make phan
