name: Check runtime version bump

on:
  pull_request:
    paths: ['packages/qit-runtime/**']

jobs:
  check-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Verify version was bumped
        run: |
          PUBLISHED=$(npm view @woocommerce/qit-runtime version 2>/dev/null || echo "0.0.0")
          LOCAL=$(node -p "require('./packages/qit-runtime/package.json').version")
          if [ "$PUBLISHED" = "$LOCAL" ]; then
            echo "::error::packages/qit-runtime/ changed but version ($LOCAL) was not bumped. Bump the version in packages/qit-runtime/package.json and src/index.ts before merging."
            exit 1
          fi
          echo "Version check passed: $LOCAL (published: $PUBLISHED)"
