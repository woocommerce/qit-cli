name: Releases

on:
  push:
    tags:
      - '*'

jobs:
  code-tests:
    name: Run code tests
    uses: ./.github/workflows/code-tests.yml
  build:
    needs: [ code-tests ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NO_COLOR: 1
      QIT_DISABLE_ONBOARDING: yes
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          tools: none
          php-version: '7.4'
      - name: Version Validation
        run: |
          if ./qit --version | grep -q "qit_dev_build"; then
            echo "Development build detected. Exiting with failure."
            exit 1
          else
            echo "Valid build version. Proceeding."
          fi
      - uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          artifacts: "qit"
          bodyFile: ./docs/changelogs/${{github.ref_name}}.md
          generateReleaseNotes: true
      - name: Basic Validation
        run: ./qit
