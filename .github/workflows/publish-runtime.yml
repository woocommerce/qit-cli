name: Publish @woocommerce/qit-runtime

on:
  push:
    branches: [trunk]
    paths: ['packages/qit-runtime/**']

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # OIDC trusted publishing needs npm >= 11.5.1; npm 12 no longer installs on Node 20.
      - name: Ensure npm supports OIDC
        run: npm install -g npm@11

      - name: Install, test, build
        working-directory: packages/qit-runtime
        run: npm ci && npm test && npm run build

      - name: Publish
        working-directory: packages/qit-runtime
        run: npm publish --access public --provenance
