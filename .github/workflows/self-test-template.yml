name: Self Test Template

on:
  workflow_call:
    inputs:
      test_type:
        required: true
        type: string

    secrets:
      QIT_USER:
        required: true
      QIT_ACCESS_TOKEN:
        required: true
      QIT_STAGING_SECRET:
        required: true

jobs:
  self_test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NO_COLOR: 1
      FORCE_COLOR: 0
      QIT_DISABLE_ONBOARDING: yes

    steps:
      - name: Create tmp directory
        run: mkdir -p ${{ github.workspace }}/tmp
      - name: Wait before request to avoid 429
        if: github.event_name != 'workflow_dispatch'
        env:
          TEST_TYPE: ${{ inputs.test_type }}
        run: |
          case "$TEST_TYPE" in
            activation)       WAIT_SECONDS=0 ;;
            woo-api)          WAIT_SECONDS=30 ;;
            phpstan)          WAIT_SECONDS=60 ;;
            security)         WAIT_SECONDS=90 ;;
            phpcompatibility) WAIT_SECONDS=120 ;;
            malware)          WAIT_SECONDS=150 ;;
            validation)       WAIT_SECONDS=180 ;;
            woo-e2e)          WAIT_SECONDS=210 ;;
            *) echo "::error::Unknown test type: $TEST_TYPE"; exit 1 ;;
          esac
          echo "Test type is $TEST_TYPE. Waiting $WAIT_SECONDS seconds."
          sleep "$WAIT_SECONDS"

      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '7.4'

      - name: Composer install
        working-directory: _tests/managed_tests
        run: composer install

      - name: Composer install on Src
        working-directory: src
        run: composer install

      - name: Test self-test runner
        working-directory: _tests/managed_tests
        run: vendor/bin/phpunit --do-not-cache-result --filter '/(QITLiveOutputTest|NormalizationTest)/' tests/self_test

      - name: Connect to QIT
        run: ./qit partner:add --user="${{ secrets.QIT_USER }}" --application_password="${{ secrets.QIT_ACCESS_TOKEN }}"

      #- name: Enable dev (Staging)
      #  run: ./qit dev

      #- name: Connect to QIT (Staging)
      #  run: ./qit backend:add --environment="staging" --qit_secret="${{ secrets.QIT_STAGING_SECRET }}" --manager_url="https://stagingcompatibilitydashboard.wpcomstaging.com"

      ### Cache ZIP Image
      - name: Set up date
        id: date
        run: |
          echo "ZIP_YEAR=$(date +'%Y')" >> $GITHUB_ENV
          echo "ZIP_MONTH=$(date +'%m')" >> $GITHUB_ENV

      - name: Restore ZIP Image Cache if it exists
        id: cache-docker-zip
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: cache-zip
          key: cache-docker-zip-${{ env.ZIP_YEAR }}-${{ env.ZIP_MONTH }}

      - name: Update ZIP Image Cache if cache miss
        if: steps.cache-docker-zip.outputs.cache-hit != 'true'
        run: docker pull joshkeegan/zip:latest && mkdir -p cache-zip && docker image save joshkeegan/zip:latest --output ./cache-zip/zip.tar

      - name: Use ZIP Image Cache if cache hit
        if: steps.cache-docker-zip.outputs.cache-hit == 'true'
        run: docker image load --input ./cache-zip/zip.tar
      ## <!-- End Cache ZIP Image -->

      - name: Run Self-Tests
        id: run-self-tests
        working-directory: _tests/managed_tests
        env:
          QIT_WAIT_BEFORE_REQUEST: yes
        run: php ./QITSelfTests.php run ${{ inputs.test_type }} --debug

      # After the tests run, upload all qit_non_json_ files (each test has its own)
      - name: Upload all QIT non-JSON output files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qit-non-json-outputs
          path: '/tmp/qit_non_json_*'
